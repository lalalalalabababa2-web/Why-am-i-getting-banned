name: SIM Toggle

on:
  push:
    branches: [claude/app-setting-toggle-lx353x, sim-toggle]
    paths:
      - 'sim-toggle/**'
      - '.github/workflows/sim-toggle.yml'
  workflow_dispatch:

# The same pinned actions as Offline AI's workflow.
permissions:
  contents: write

concurrency:
  group: sim-toggle-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sim-toggle

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.2" > /dev/null

      - name: Build
        run: ci/gradle.sh :app:assembleRelease

      - name: Check the APK
        run: |
          cp app/build/outputs/apk/release/*.apk SimToggle.apk
          ls -la SimToggle.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs SimToggle.apk
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging SimToggle.apk | head -5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SimToggle-apk
          path: sim-toggle/SimToggle.apk
          if-no-files-found: error
          retention-days: 30

  # The app opens, its tile works, and its SIM calls go through as the shell user (the identity
  # Shizuku gives it): switching the emulator's SIM off and on both ways.
  emulator:
    name: Emulator (Android API ${{ matrix.api }})
    needs: apk
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@v4
        with:
          name: SimToggle-apk
          path: sim-toggle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 3072M
          cores: 3
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: sim-toggle
          script: bash ci/emulator-check.sh SimToggle.apk emulator-out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: emulator-api${{ matrix.api }}
          path: sim-toggle/emulator-out
          if-no-files-found: ignore
          retention-days: 14

  # A fixed release name, so the download link never changes:
  # https://github.com/<owner>/<repo>/releases/download/sim-toggle-latest/SimToggle.apk
  publish:
    name: Publish
    needs: [apk, emulator]
    if: github.ref == 'refs/heads/claude/app-setting-toggle-lx353x' || github.ref == 'refs/heads/sim-toggle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@v4
        with:
          name: SimToggle-apk
          path: sim-toggle

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          VERSION=$("$ANDROID_HOME/build-tools/$BT/aapt2" dump badging SimToggle.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          cat > notes.md <<EOF
          SIM Toggle $VERSION, built from ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`. It was opened and its SIM calls were checked on Android 14 and 16 emulators before it was published.

          Install: open SimToggle.apk on the phone and allow installs from your browser when Android asks. New builds install over the old one.

          Needs Shizuku (https://shizuku.rikka.app) running, since Android only lets system apps switch SIMs. Android 11 or newer.
          EOF
          gh release delete sim-toggle-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create sim-toggle-latest SimToggle.apk --target "$GITHUB_SHA" --title "SIM Toggle $VERSION" --notes-file notes.md --latest=false
