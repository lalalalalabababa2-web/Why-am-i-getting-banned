name: HumKiller

# HumKiller (humkiller/): the DSP test bench, the Android APK and the Mac app. Runs on any branch
# when humkiller/ changes. It publishes nothing: the APK and the Mac app are this run's artifacts.
on:
  push:
    paths:
      - 'humkiller/**'
      - '.github/workflows/humkiller.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: humkiller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: DSP test bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run
        run: |
          cd humkiller && mkdir -p build
          c++ -std=c++17 -O2 -Wall -Wextra -Werror sim/sim.cpp core/hk_core.cpp -o build/sim
          ./build/sim

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null

      - name: Build
        run: ci/gradle.sh -p humkiller/android :app:assembleRelease

      - name: Check the APK
        run: |
          APK=$(ls humkiller/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" HumKiller.apk
          ls -la HumKiller.apk
          unzip -l HumKiller.apk 'lib/*' | awk '{print $1, $4}'
          unzip -l HumKiller.apk lib/arm64-v8a/libhumkiller.so > /dev/null || { echo "::error::libhumkiller.so is missing"; exit 1; }
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs HumKiller.apk
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging HumKiller.apk | head -5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HumKiller-android
          path: HumKiller.apk
          if-no-files-found: error
          retention-days: 30

  mac:
    name: Mac app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build
        run: |
          swiftc --version
          humkiller/build.sh

      - name: Test bench on ARM
        run: humkiller/build.sh sim

      - name: Package
        run: cd humkiller/build && ditto -c -k --keepParent HumKiller.app HumKiller-mac.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HumKiller-mac
          path: humkiller/build/HumKiller-mac.zip
          if-no-files-found: error
          retention-days: 30
