name: Offline AI

on:
  push:
    branches: [offline-ai]
  workflow_dispatch:
    inputs:
      only:
        description: 'Leave empty for everything. "screens": only pictures of every screen, from the emulator. "images": only the picture models, on an ARM machine.'
        required: false
        default: ''

# The same pinned actions as the Umbra browser's workflows.
permissions:
  contents: write

concurrency:
  group: offline-ai-${{ github.ref }}-${{ inputs.only }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (desktop, tiny random models)
    if: inputs.only != 'screens' && inputs.only != 'images'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      # llama.cpp built for the runner, tiny random models made by llama.cpp's own tool, and the
      # prompt-cache checks against them (see tools/host-test/test_engine.cpp).
      - name: Run
        run: tools/host-test/run.sh

      # The same tiny models go into the on-device tests.
      - name: Keep the test models
        run: |
          mkdir -p test-models
          cp build/host-test/models/qwen35-dense.gguf test-models/test-qwen35.gguf
          cp build/host-test/models/llama-dense.gguf test-models/test-llama.gguf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-models
          path: test-models
          retention-days: 7

  # Real models, built without sanitizers: drafting with Qwen3.5's MTP head (same words, and how
  # much faster), a picture and video frames, compute memory, and the Bonsai 1-bit and ternary
  # models. Once on an x86 runner and once on an ARM one (closer to a phone, still not a phone).
  real-models:
    name: Real models (${{ matrix.cpu }})
    if: inputs.only != 'screens' && inputs.only != 'images'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x86_64
            os: ubuntu-latest
          - cpu: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      # about 21 GB of models; the x86 image carries SDKs these tests do not need
      - name: Disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h .

      - name: Download the models
        run: |
          mkdir -p real-models && cd real-models
          get() { curl -fsSL --retry 4 --retry-delay 10 -o "$2" "https://huggingface.co/$1/resolve/main/$2"; ls -la "$2"; }
          get unsloth/Qwen3.5-0.8B-MTP-GGUF Qwen3.5-0.8B-Q4_K_M.gguf
          get unsloth/Qwen3.5-0.8B-MTP-GGUF mmproj-F16.gguf
          get unsloth/Qwen3.5-4B-MTP-GGUF Qwen3.5-4B-Q4_K_M.gguf
          get unsloth/gemma-4-E2B-it-GGUF gemma-4-E2B-it-Q4_K_M.gguf
          get unsloth/gemma-4-E2B-it-GGUF mtp-gemma-4-E2B-it.gguf
          get unsloth/Llama-3.2-1B-Instruct-GGUF Llama-3.2-1B-Instruct-Q4_K_M.gguf
          get prism-ml/Ternary-Bonsai-2-9B-gguf Ternary-Bonsai-2-9B-Q2_0.gguf
          get prism-ml/Bonsai-27B-gguf Bonsai-27B-Q1_0.gguf
          get mradermacher/Huihui-Qwen3.5-2B-abliterated-GGUF Huihui-Qwen3.5-2B-abliterated.Q4_K_M.gguf
          get mradermacher/Huihui-LFM2.5-1.2B-Instruct-abliterated-GGUF Huihui-LFM2.5-1.2B-Instruct-abliterated.Q4_K_M.gguf
          # Spark-X2.6 (answers, thinking), pictures and video frames with Qwen3-VL and LFM2.5-VL, and
          # LFM2.5-VL's DSpark block drafter (same words with and without it, and how fast)
          get bartowski/Spark-X2.6-1.7B-GGUF Spark-X2.6-1.7B-Q4_K_M.gguf
          get Qwen/Qwen3-VL-2B-Instruct-GGUF Qwen3VL-2B-Instruct-Q4_K_M.gguf
          get Qwen/Qwen3-VL-2B-Instruct-GGUF mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf
          get LiquidAI/LFM2.5-VL-3B-GGUF LFM2.5-VL-3B-Q4_K_M.gguf
          get LiquidAI/LFM2.5-VL-3B-GGUF mmproj-LFM2.5-VL-3B-Q8_0.gguf
          get LiquidAI/LFM2.5-VL-3B-DSpark-GGUF LFM2.5-VL-3B-DSpark-F16.gguf
          df -h . ; free -g ; nproc ; lscpu | grep -iE 'model name|flags' | cut -c1-300

      # Offline AI's ARM kernels for Bonsai's 1- and 2-bit weights, against plain C, with and
      # without the dot-product instructions; and how fast they are on one core.
      - name: Kernels
        if: matrix.cpu == 'arm64'
        run: |
          set -o pipefail
          gcc -O2 -std=c11 -mcpu=native -I third_party/llama.cpp/ggml/src tools/host-test/test_kernels.c -lm -o tk-native
          gcc -O2 -std=c11 -march=armv8-a -I third_party/llama.cpp/ggml/src tools/host-test/test_kernels.c -lm -o tk-v80
          (./tk-native && ./tk-v80) 2>&1 | tee real.log

      - name: Run
        env:
          REAL_MODELS: ${{ github.workspace }}/real-models
        run: |
          set -o pipefail
          tools/host-test/real.sh 2>&1 | tee -a real.log

      # Bonsai 27B once more with only 3 GB of memory, less than the model: what happens on a phone
      # without enough free memory (the app should notice the storage reads and say so).
      - name: Bonsai 27B in 3 GB
        if: matrix.cpu == 'arm64'
        continue-on-error: true
        run: |
          OUT=build/host-test
          echo "== Bonsai 27B, memory limited to 3 GB" | tee -a real.log
          # pages already cached count against the memory of whoever read them first, so start cold
          sync && echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
          sudo systemd-run --scope -q -p MemoryMax=3G -p MemorySwapMax=0 \
            timeout 900 "$OUT/test_engine_real" "$OUT/models" third_party/llama.cpp real-models --one real-models/Bonsai-27B-Q1_0.gguf 2>&1 \
            | sed 's/^SPEED: /SPEED: [3 GB] /' | tee -a real.log || echo "  (stopped or failed: $?)" | tee -a real.log
      # GitHub keeps at most 10 notices a step, so the results go out as a few multi-line ones.
      - name: Results
        if: always()
        run: python3 ci/real_report.py real.log ${{ matrix.cpu }}

  emulator:
    name: On-device tests (Android 14 emulator)
    needs: engine-tests
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
          sudo apt-get update -q && sudo apt-get install -y -q ccache

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-x86-${{ hashFiles('.gitmodules', 'app/src/main/cpp/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-x86-${{ hashFiles('.gitmodules', 'app/src/main/cpp/CMakeLists.txt') }}-
            ccache-x86-

      - uses: actions/download-artifact@v4
        with:
          name: test-models
          path: app/src/androidTest/assets

      # The emulator runs x86_64, so this build is x86_64; the APK people install is not.
      - name: Build for the emulator
        env:
          USE_CCACHE: '1'
        run: ci/gradle.sh :app:assembleDebug :app:assembleDebugAndroidTest -PtestAbi=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 3
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb shell settings put system screen_off_timeout 1800000 || true
            adb shell svc power stayon true || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null || true
            adb logcat -c
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest -PtestAbi=x86_64 || touch tests-failed
            adb logcat -d > logcat.txt

      - name: Report
        if: always()
        run: python3 ci/device_report.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: device-test-results
          path: |
            logcat.txt
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 14

  apk:
    name: Build the APK
    if: inputs.only != 'screens' && inputs.only != 'images'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
          sudo apt-get update -q && sudo apt-get install -y -q ccache

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ hashFiles('.gitmodules', 'app/src/main/cpp/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ hashFiles('.gitmodules', 'app/src/main/cpp/CMakeLists.txt') }}-
            ccache-

      # Kotlin first: a mistake there shows up in a few minutes instead of after the native build.
      - name: Compile the Kotlin code
        run: ci/gradle.sh :app:compileReleaseKotlin

      - name: Build the APK (llama.cpp for ARM included)
        env:
          USE_CCACHE: '1'
        run: |
          ci/gradle.sh :app:assembleRelease
          ccache --show-stats || true

      - name: Check the APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" OfflineAI.apk
          ls -la OfflineAI.apk
          echo "--- native libraries"
          unzip -l OfflineAI.apk 'lib/*' | awk '{print $1, $4}'
          for lib in libofflineai.so libllama.so libllama-common.so libggml.so libggml-base.so libc++_shared.so; do
            unzip -l OfflineAI.apk "lib/arm64-v8a/$lib" > /dev/null || { echo "::error::$lib is missing from the APK"; exit 1; }
          done
          n=$(unzip -l OfflineAI.apk 'lib/arm64-v8a/libggml-cpu-*' | grep -c 'libggml-cpu-')
          echo "CPU variants: $n"
          [ "$n" -ge 1 ] || { echo "::error::no ggml CPU backend in the APK"; exit 1; }
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs OfflineAI.apk
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging OfflineAI.apk | head -5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OfflineAI-apk
          path: OfflineAI.apk
          if-no-files-found: error
          retention-days: 30

  # Only a build whose on-device tests passed becomes the download, and only from this branch: a
  # run started by hand on another branch tests and builds it (the APK is in its artifacts) but
  # leaves the download link alone.
  publish:
    name: Publish
    needs: [apk, emulator, engine-tests]
    if: github.ref == 'refs/heads/offline-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@v4
        with:
          name: OfflineAI-apk

      # A release with a fixed name, so the download link never changes:
      # https://github.com/<owner>/<repo>/releases/download/offline-ai-latest/OfflineAI.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=OfflineAI/ -o OfflineAI-source.zip HEAD
          VERSION=$("$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump badging OfflineAI.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          cat > notes.md <<EOF
          Offline AI $VERSION, built from ${GITHUB_SHA::7} on the \`offline-ai\` branch. Its engine tests and on-device tests passed before it was published.

          Install: open OfflineAI.apk on the phone and allow installs from your browser when Android asks. Each new build installs over the last one and keeps your models and chats.

          Runs GGUF models on the phone's CPU with llama.cpp $(grep llamaCppVersion gradle.properties | cut -d= -f2). Built for 64-bit ARM phones (Android 11 or newer). OfflineAI-source.zip is this version's source (llama.cpp itself is a submodule and not included).
          EOF
          gh release delete offline-ai-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create offline-ai-latest OfflineAI.apk OfflineAI-source.zip --target "$GITHUB_SHA" --title "Offline AI $VERSION" --notes-file notes.md --latest=false

  # A run started by hand on any other branch: its APK as a pre-release with a fixed link, so a
  # build can be tried on a phone before it reaches offline-ai (and before its on-device tests end):
  # https://github.com/<owner>/<repo>/releases/download/offline-ai-preview/OfflineAI.apk
  preview:
    name: Preview download
    needs: [apk]
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/offline-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OfflineAI-apk

      - name: Publish the preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          A preview of Offline AI, built from ${GITHUB_SHA::7} on the \`${GITHUB_REF_NAME}\` branch (run ${GITHUB_RUN_NUMBER}). Published as soon as it was built, before its on-device tests finished: the tested build is the one at offline-ai-latest.

          Install: open OfflineAI.apk on the phone and allow installs from your browser when Android asks. It installs over the other builds and keeps your models and chats.
          NOTES
          gh release delete offline-ai-preview --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create offline-ai-preview OfflineAI.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Offline AI preview (run ${GITHUB_RUN_NUMBER})" --notes-file notes.md --prerelease --latest=false

  # Pictures of every screen, dark and light, from the emulator: for looking at the interface after
  # changing it. Started by hand with only=screens; builds only what the emulator needs and runs
  # only ScreenshotTest.
  screens:
    name: Screenshots (Android 14 emulator)
    if: inputs.only == 'screens'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
          sudo apt-get update -q && sudo apt-get install -y -q ccache ninja-build

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-x86-${{ hashFiles('.gitmodules', 'app/src/main/cpp/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-x86-${{ hashFiles('.gitmodules', 'app/src/main/cpp/CMakeLists.txt') }}-
            ccache-x86-

      # The tiny random models the screens load, made by llama.cpp's own tool (kept between runs).
      - name: Test models (kept)
        id: models
        uses: actions/cache@v4
        with:
          path: app/src/androidTest/assets
          key: test-models-${{ hashFiles('.gitmodules', 'tools/host-test/models.sh') }}
      - name: Test models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          tools/host-test/models.sh
          mkdir -p app/src/androidTest/assets
          cp build/host-test/models/qwen35-dense.gguf app/src/androidTest/assets/test-qwen35.gguf
          cp build/host-test/models/llama-dense.gguf app/src/androidTest/assets/test-llama.gguf

      - name: Build for the emulator
        env:
          USE_CCACHE: '1'
        run: ci/gradle.sh :app:assembleDebug :app:assembleDebugAndroidTest -PtestAbi=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take the pictures
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 3
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb shell settings put system screen_off_timeout 1800000 || true
            adb shell svc power stayon true || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null || true
            adb logcat -c
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest -PtestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=app.offlineai.chat.ScreenshotTest -Pandroid.testInstrumentationRunnerArguments.shots=1 || touch tests-failed
            adb pull /sdcard/Download/oa-shots shots || true
            adb logcat -d > logcat.txt

      - name: Report
        if: always()
        run: |
          ls -la shots 2>/dev/null | head -80 || echo "no pictures"
          python3 ci/device_report.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screens
          path: |
            shots
            logcat.txt
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 14

  # The picture maker (stable-diffusion.cpp on llama.cpp's ggml, as in the app) with the real
  # picture models, on an ARM machine: how long each takes, and the pictures to look at.
  images:
    name: Picture models (arm64)
    if: inputs.only == 'images'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build python3-pil

      - name: Build
        run: |
          cmake -S tools/image-test -B build/image-test -G Ninja -DCMAKE_BUILD_TYPE=Release > configure.log 2>&1 || { tail -50 configure.log; exit 1; }
          cmake --build build/image-test --target sdtest > build.log 2>&1 || { grep -E "error" build.log | head -60; exit 1; }

      - name: Models
        run: |
          mkdir -p m && cd m
          get() { curl -fsSL --retry 4 --retry-delay 10 -o "$1" "https://huggingface.co/$2/resolve/main/$3"; ls -la "$1"; }
          get sdxs.gguf concedo/sdxs-512-tinySDdistilled-GGUF sdxs-512-tinySDdistilled_Q8_0.gguf
          get turbo.gguf Green-Sky/SD-Turbo-GGUF sd_turbo-f16-q8_0.gguf
          get lcm.gguf stduhpf/dreamshaper-8LCM-im-GGUF-sdcpp dreamshaper_8LCM-iq4_nl.gguf
          get dmd2.gguf mrfatso/DMD2-dreamshaper-v1-5-GGUF DMD2-dreamshaper-v1-5-q4_0.gguf
          get taesd.safetensors madebyollin/taesd diffusion_pytorch_model.safetensors

      - name: Make pictures
        run: |
          mkdir -p pictures
          T=build/image-test/sdtest
          P="a photograph of an orange tabby cat sitting on a windowsill, soft morning light"
          for spec in "sdxs 1 euler_a -" "turbo 2 euler_a tae" "lcm 4 lcm tae" "dmd2 4 lcm tae"; do
            set -- $spec
            D=""; [ "$4" = tae ] && D=m/taesd.safetensors
            for threads in 4 8; do
              echo "== $1, $threads threads"
              $T m/$1.gguf "$P" pictures/$1-$threads.ppm 512 512 $2 1 42 $threads $3 $D 2>&1 | grep -E "generated|failed" || true
            done
          done
          python3 -c "
          import glob
          from PIL import Image
          for f in glob.glob('pictures/*.ppm'): Image.open(f).save(f[:-4] + '.png')
          "
          rm -f pictures/*.ppm

